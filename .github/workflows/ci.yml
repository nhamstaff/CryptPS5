name: CryptPS5 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: Build & Verify (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build ps5decrypt CLI
        run: |
          g++ -std=c++20 -O2 -I core/decrypt/include core/decrypt/ps5decrypt.cpp core/decrypt/KeyDatabase.cpp -o ps5decrypt

      - name: Verify ps5decrypt CLI
        run: |
          ./ps5decrypt --help

      - name: Build & Run HLE Verification Suite
        run: |
          g++ -std=c++20 -O2 -I core/libs -I core/relinker/relinker/include core/tests_hle_verification.cpp core/libs/prx/libkernel/DirectMemory/VirtualMemorySim.cpp core/relinker/relinker/src/ElfSymbolMapper.cpp -o tests_hle_verification
          ./tests_hle_verification

  verify-windows:
    name: Build & Verify (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup MSYS2 MinGW Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build ps5decrypt CLI
        shell: msys2 {0}
        run: |
          g++ -std=c++20 -O2 -I core/decrypt/include core/decrypt/ps5decrypt.cpp core/decrypt/KeyDatabase.cpp -o ps5decrypt.exe

      - name: Verify ps5decrypt CLI
        shell: msys2 {0}
        run: |
          ./ps5decrypt.exe --help

      - name: Build & Run HLE Verification Suite
        shell: msys2 {0}
        run: |
          g++ -std=c++20 -O2 -I core/libs -I core/relinker/relinker/include core/tests_hle_verification.cpp core/libs/prx/libkernel/DirectMemory/VirtualMemorySim.cpp core/relinker/relinker/src/ElfSymbolMapper.cpp -o tests_hle_verification.exe
          ./tests_hle_verification.exe
